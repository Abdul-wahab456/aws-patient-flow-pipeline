name: Deploy

# After every push to main: check the code (CI), and only if the checks pass, deploy it to AWS
# (the CloudFormation stacks pf-foundation and pf-pipeline).
# Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never deploy twice at the same time; a newer push waits for the running deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets the job ask GitHub for a short-lived identity token (no stored AWS keys)
    env:
      # Names, not secrets. Set them in the repository: Settings > Secrets and variables > Actions > Variables
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAKE_BUCKET: ${{ vars.LAKE_BUCKET }}
      RESULTS_BUCKET: ${{ vars.RESULTS_BUCKET }}
      SILVER_DATABASE: ${{ vars.SILVER_DATABASE }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3==1.43.117

      # Exchanges GitHub's identity token for temporary AWS credentials of the deploy role.
      # The role only trusts this repository's main branch.
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The Git commit id names this deployment. stacks.py deploys the foundation stack, uploads the code of this
      # commit (Glue scripts, Lambda zip, workflow definition) and deploys the pipeline stack, which points at it.
      # CloudFormation creates the resources as the CloudFormation role; the login role can only hand over to it.
      - name: Deploy the CloudFormation stacks
        run: python infra/stacks.py --version "${{ github.sha }}" --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}"
